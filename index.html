<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Contract Database</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      margin-bottom: 30px;
    }

    .search-box input {
      width: 100%;
      padding: 15px 20px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      border-color: #0070f3;
    }

    .results-grid {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .result-item {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
    }

    .hotel-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .location {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 15px;
    }

    .contract-label, .expiry-label {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    .btn-open {
      display: inline-block;
      margin-top: 5px;
      padding: 8px 12px;
      background-color: #0070f3;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
      transition: background-color 0.2s;
    }

    .btn-open:hover {
      background-color: #0051a8;
    }

    .expiry-date {
      font-size: 16px;
      font-weight: 500;
      color: #ff4d4f;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search hotel name... (พิมพ์ชื่อโรงแรมเพื่อค้นหา... )" oninput="handleSearch()">
  </div>

  <div class="results-grid" id="resultsContainer"></div>

  <script>
    let timer;
    function handleSearch() {
      const keyword = document.getElementById('searchInput').value;
      clearTimeout(timer);

      timer = setTimeout(async () => {
        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        if (!keyword.trim()) return;

        try {
          const response = await fetch(`/api/search?query=${encodeURIComponent(keyword)}`);
          const data = await response.json();

          if (!data || data.length === 0) {
            container.innerHTML = '<div style="color:#888; text-align:center; grid-column: 1/-1;">ไม่พบข้อมูลโรงแรม</div>';
            return;
          }

          data.forEach(item => {
            container.innerHTML += `
              <div class="result-item">
                <div class="hotel-name">${item.name}</div>
                <div class="location">${item.location}</div>

                <div class="contract-label">📄 Contract Rate</div>
                <a href="${item.contractUrl}" target="_blank" class="btn-open">[ OPEN FILE ]</a>

                <div class="expiry-label">Expiry Date</div>
                <div class="expiry-date">${item.expiryDate}</div>
              </div>
            `;
          });
        } catch (error) {
          console.error('Search error:', error);
        }
      }, 300);
    }
  </script>
</body>
</html>
